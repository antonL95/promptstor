name: PromptStor check
description: Fail when the committed agent files differ from the .promptstor folder
inputs:
  version:
    description: The PromptStor release to run, for example v1.0.0
    required: true
  working-directory:
    description: The repository folder that holds .promptstor
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Download and verify PromptStor
      shell: bash
      env:
        PROMPTSTOR_VERSION: ${{ inputs.version }}
        RUNNER_SYSTEM: ${{ runner.os }}
        RUNNER_MACHINE: ${{ runner.arch }}
        DOWNLOAD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        case "$RUNNER_SYSTEM" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "unsupported runner system: $RUNNER_SYSTEM" >&2; exit 2 ;;
        esac
        case "$RUNNER_MACHINE" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner architecture: $RUNNER_MACHINE" >&2; exit 2 ;;
        esac
        if [[ ! "$PROMPTSTOR_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "version must look like v1.0.0, got: $PROMPTSTOR_VERSION" >&2
          exit 2
        fi
        archive="promptstor_${PROMPTSTOR_VERSION#v}_${os}_${arch}.tar.gz"
        base="https://github.com/antonL95/promptstor/releases/download/${PROMPTSTOR_VERSION}"
        dir="$(mktemp -d "${DOWNLOAD_ROOT}/promptstor.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 --output "$dir/$archive" "$base/$archive"
        curl --fail --silent --show-error --location --retry 3 --output "$dir/checksums.txt" "$base/checksums.txt"
        expected="$(awk -v name="$archive" '$2 == name { print $1 }' "$dir/checksums.txt")"
        if command -v sha256sum >/dev/null; then
          actual="$(sha256sum "$dir/$archive" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "$dir/$archive" | awk '{ print $1 }')"
        fi
        if [[ -z "$expected" || "$expected" != "$actual" ]]; then
          echo "checksum mismatch for $archive" >&2
          exit 2
        fi
        tar -xzf "$dir/$archive" -C "$dir" promptstor
        echo "PROMPTSTOR_BIN=$dir/promptstor" >> "$GITHUB_ENV"
    - name: Check the project files
      shell: bash
      env:
        PROMPTSTOR_DIR: ${{ inputs.working-directory }}
      run: '"$PROMPTSTOR_BIN" check --ci --dir "$PROMPTSTOR_DIR"'
