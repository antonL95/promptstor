items:
- kind: rule
  name: CLAUDE
  order: 10
  source: <home>/.claude/CLAUDE.md
  body: |
    # Personal rules

    Keep answers short.

    ```text
    @never-imported.md
    ```
- kind: rule
  name: Reviews
  order: 20
  source: <home>/.claude/CLAUDE.md
  body: |
    ## Reviews

    Be critical. See @missing-guide.md for more.
- kind: rule
  name: Style
  order: 10
  source: <home>/notes/style.md
  body: |
    ## Style

    Use plain words.
- kind: rule
  name: Testing
  order: 10
  source: <home>/.claude/shared/testing.md
  body: |
    ## Testing

    Write the test first.
- kind: rule
  name: cursor-style
  order: 10
  source: <home>/.claude/rules/cursor-style.md
  body: |
    Prefer function components.
- kind: rule
  name: Go
  order: 10
  source: <home>/.claude/rules/go.md
  activation: files
  scope:
  - '**/*.go'
  - go.mod
  body: |
    ## Go

    Run gofmt.
- kind: command
  name: git:commit
  source: <home>/.claude/commands/git/commit.md
  body: |
    Write a commit message for the staged changes.
- kind: command
  name: review
  source: <home>/.claude/commands/review.md
  description: Review a PR
  meta:
    allowed-tools: Bash(gh pr view *)
    argument-hint: '[pr-number]'
  body: |
    Review PR $0.
- kind: subagent
  name: code-reviewer
  source: <home>/.claude/agents/reviewer.md
  description: Reviews diffs for bugs. Use after edits.
  meta:
    color: blue
    model: sonnet
    tools: Read, Grep, Glob
  body: |
    You are a strict reviewer.
- kind: skill
  name: release-notes
  source: <home>/.claude/skills/release-notes
  description: Draft release notes from the git log.
  meta:
    allowed-tools: Bash(git log *)
  files:
  - scripts/run.sh 0755
  body: |
    Summarise the changes since the last tag.
- kind: permission
  name: Claude Code permissions
  source: <home>/.claude/settings.json
  native:
    claude-code:
      ask:
      - Bash(git commit *)
      deny:
      - WebFetch(domain:example.org)
  portable:
    denycommands:
    - git push --force
    - rm
    denypaths:
    - ./.env
    - /etc/example/**
    allowmcpservers: []
- kind: hook
  name: PreToolUse Edit|Write
  source: <home>/.claude/settings.json
  native:
    claude-code:
      event: PreToolUse
      hooks:
      - command: ~/.claude/hooks/guard.sh
        type: command
      matcher: Edit|Write
- kind: hook
  name: SessionStart
  source: <home>/.claude/settings.json
  native:
    claude-code:
      event: SessionStart
      hooks:
      - command: ~/.claude/hooks/start.sh
        statusMessage: Loading
        timeout: 10
        type: command
- kind: mcp
  name: docs
  source: <home>/.claude.json
  mcp:
    transport: stdio
    command: example-docs
    url: ""
    args:
    - --token
    - ${env:TOKEN}
    env:
      DOCS_TOKEN:
        literal: ""
        ref: env:DOCS_TOKEN
      MODE:
        literal: readonly
        ref: ""
    headers: {}
    resolve: false
- kind: mcp
  name: remote
  source: <home>/.claude.json
  mcp:
    transport: http
    command: ""
    url: https://mcp.example.com/mcp
    args: []
    env: {}
    headers:
      Authorization:
        literal: ""
        ref: needs-setup:Authorization
    resolve: false
foreign:
- path: <home>/.claude/plugins
  owner: claude-code plugins
  reason: installed plugins; Claude Code manages them
- path: <home>/.claude/skills/synced/bucket-0001/pdf-tools
  owner: claude.ai
  reason: synced skill; Claude Code overwrites it
grants:
- tool: claude-code
  path: <home>/.claude/settings.json
  key: /permissions/allow@=Bash(make test *)
  value: Bash(make test *)
- tool: claude-code
  path: <home>/.claude/settings.json
  key: /permissions/allow@=mcp__docs
  value: mcp__docs
notes:
- path: <home>/.claude.json
  message: 'server docs: secret scrubbed, set TOKEN'
- path: <home>/.claude.json
  message: 'server remote: field headersHelper not imported'
- path: <home>/.claude.json
  message: 'server remote: secret scrubbed, headers/Authorization'
- path: <home>/.claude.json
  message: local scope server local-db for /work/example-app; not imported
- path: <home>/.claude/rules/cursor-style.md
  message: ignored by Claude Code; it reads only paths
- path: <home>/.claude/skills/linked
  message: symlinked -> ../../dotfiles/skills/linked; not imported
unresolved:
- file: <home>/.claude/CLAUDE.md
  line: "14"
  target: missing-guide.md
  reason: missing
