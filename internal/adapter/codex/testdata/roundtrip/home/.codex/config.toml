model = "example-model"

[mcp_servers.docs]
command = "example-docs"
args = ["--verbose"]
env_vars = ["DOCS_TOKEN"]
enabled = true

[mcp_servers.docs.env]
MODE = "readonly"

[mcp_servers.remote]
url = "https://mcp.example.com/mcp"
bearer_token_env_var = "REMOTE_TOKEN"
http_headers = { "X-Static" = "v1" }
env_http_headers = { "X-Team" = "TEAM_NAME" }

[notice]
hide_full_access_warning = true
